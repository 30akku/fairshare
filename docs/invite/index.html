<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#235347"><meta name="robots" content="noindex">
  <title>Join a FairShare group</title><link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="nav shell"><a class="brand" href="../"><span class="brand-mark">F</span><span>FairShare</span></a></header>
  <main class="invite-page shell">
    <p class="eyebrow">Group invitation</p><h1>You’re invited<br>to FairShare.</h1>
    <p class="lede">If FairShare is installed, Android should open this invitation automatically. Otherwise, install the app and paste the invite code below.</p>
    <div class="invite-box"><strong>Your invite code</strong><p class="token" data-invite-token>Loading…</p>
      <div class="actions"><button class="button secondary" type="button" data-copy-token>Copy invite code</button>
        <a class="button primary" data-download href="https://github.com/anshi/fairshare/releases/latest">Download FairShare</a></div>
    </div>
  </main>
  <script src="../app.js" defer></script>
</body>
</html>
