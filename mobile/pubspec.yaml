name: fairshare
description: A transparent, social group expense sharing app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  dio: ^5.11.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  google_sign_in: ^7.2.0
  decimal: ^3.2.6
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
