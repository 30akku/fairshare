name: Process recurring expenses
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and process due expenses
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          MAINTENANCE_KEY: ${{ secrets.MAINTENANCE_KEY }}
        run: curl --fail-with-body --retry 3 --retry-delay 30 -X POST "$API_BASE_URL/internal/maintenance/recurrences" -H "X-Maintenance-Key: $MAINTENANCE_KEY"

