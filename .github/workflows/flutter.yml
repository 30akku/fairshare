name: Flutter
on:
  push:
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test

