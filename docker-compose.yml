services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fairshare
      POSTGRES_USER: fairshare
      POSTGRES_PASSWORD: fairshare
    ports:
      - "5432:5432"
    volumes:
      - fairshare_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairshare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fairshare_postgres:

